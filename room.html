<head>

</style>

</head>

<body>

<div class="header">

<h1>🎙️ Voxa Live Room</h1>

<p>Live Voice Chat</p>

</div>


<div class="room">

<div class="room-name" id="roomName">
Voxa Room
</div>

<div class="status" id="status">
Room connecting...
</div>


<div class="user">

👤 <strong id="myName">
You
</strong>

<br>

<span id="myStatus">
🎤 Mic Off
</span>

</div>


<div class="user" id="otherUser">

👤 Waiting for another person...

</div>


<div class="controls">

<button
class="mic"
id="micButton"
>
🎤 Mic On
</button>

<button
class="leave"
id="leaveButton"
>
🚪 Leave
</button>

</div>


<div id="message"></div>

</div>


<audio
id="remoteAudio"
autoplay
playsinline
></audio>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


import {
getDatabase,
ref,
set,
remove,
onValue,
onDisconnect,
onChildAdded
}
from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";


const firebaseConfig = {

apiKey:
"AIzaSyA5gUOduogMjx8b4-knQMnFQRWPUn-xecQ",

authDomain:
"voxa-fc846.firebaseapp.com",

databaseURL:
"https://voxa-fc846-default-rtdb.firebaseio.com",

projectId:
"voxa-fc846",

storageBucket:
"voxa-fc846.firebasestorage.app",

messagingSenderId:
"337160477784",

appId:
"1:337160477784:web:4098a526345da4d02d3e2d",

measurementId:
"G-F9MTE9F5V7"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);


const params =
new URLSearchParams(
window.location.search
);

const roomName =
params.get("room") ||
"Voxa Room";


document.getElementById(
"roomName"
).textContent =
roomName;


const roomId =
encodeURIComponent(roomName);


const micButton =
document.getElementById("micButton");

const leaveButton =
document.getElementById("leaveButton");

const statusText =
document.getElementById("status");

const message =
document.getElementById("message");

const remoteAudio =
document.getElementById("remoteAudio");

const myName =
document.getElementById("myName");

const myStatus =
document.getElementById("myStatus");

const otherUser =
document.getElementById("otherUser");


let currentUser = null;

let localStream = null;

let peerConnection = null;

let currentPeerId = null;

let connected = false;


const rtcConfig = {

iceServers:[
{
urls:
"stun:stun.l.google.com:19302"
}
]

};


function showMessage(text){

message.textContent = text;

}


async function startMicrophone(){

try{

localStream =
await navigator.mediaDevices.getUserMedia({

audio:true,
video:false

});


localStream
.getAudioTracks()
.forEach(track => {

track.enabled = true;

});


micButton.textContent =
"🔇 Mic Off";

myStatus.textContent =
"🎤 Mic On";


statusText.textContent =
"🟢 Microphone connected";


showMessage(
"Microphone চালু হয়েছে"
);


if(currentPeerId){

await startConnection(
currentPeerId
);

}

}catch(error){

console.error(error);

showMessage(
"Microphone permission দিন"
);

}

}


micButton.onclick =
async () => {

if(!localStream){

await startMicrophone();

return;

}


const track =
localStream.getAudioTracks()[0];


track.enabled =
!track.enabled;


if(track.enabled){

micButton.textContent =
"🔇 Mic Off";

myStatus.textContent =
"🎤 Mic On";

}else{

micButton.textContent =
"🎤 Mic On";

myStatus.textContent =
"🔇 Mic Off";

}

};


function createPeer(){

const pc =
new RTCPeerConnection(
rtcConfig
);


if(localStream){

localStream
.getTracks()
.forEach(track => {

pc.addTrack(
track,
localStream
);

});

}


pc.ontrack =
event => {

remoteAudio.srcObject =
event.streams[0];

remoteAudio.play()
.catch(() => {});

statusText.textContent =
"🟢 Live Voice Connected";

showMessage(
"অন্য user-এর সাথে Live Voice connected 🎙️"
);

};


pc.onicecandidate =
event => {

if(!event.candidate){

return;

}


if(!currentPeerId){

return;

}


const path =
getConnectionPath(
currentUser.uid,
currentPeerId
);


const candidatePath =
isCaller(currentUser.uid,currentPeerId)
?
"callerCandidates"
:
"calleeCandidates";


const candidateRef =
ref(
db,
"voiceConnections/" +
path +
"/" +
candidatePath +
"/" +
Date.now() +
Math.random()
);


set(
candidateRef,
event.candidate.toJSON()
);

};


pc.onconnectionstatechange =
() => {

if(
pc.connectionState ===
"connected"
){

connected = true;

statusText.textContent =
"🟢 Live Voice Connected";

}

if(
pc.connectionState ===
"disconnected" ||
pc.connectionState ===
"failed"
){

connected = false;

statusText.textContent =
"🔴 Voice disconnected";

}

};


return pc;

}


function getConnectionPath(a,b){

return a < b
? a + "_" + b
: b + "_" + a;

}


function isCaller(a,b){

return a < b;

}


async function startConnection(peerId){

if(!localStream){

showMessage(
"আগে 🎤 Mic On চাপুন"
);

return;

}


if(
peerConnection &&
currentPeerId === peerId
){

return;

}


currentPeerId =
peerId;


peerConnection =
createPeer();


const path =
getConnectionPath(
currentUser.uid,
peerId
);


const base =
"voiceConnections/" +
path;


const caller =
isCaller(
currentUser.uid,
peerId
);


listenCandidates(
base,
caller
);


if(caller){

const offer =
await peerConnection.createOffer();

await peerConnection.setLocalDescription(
offer
);


await set(
ref(
db,
base + "/offer"
),
{
type:offer.type,
sdp:offer.sdp
}
);


showMessage(
"Voice connection তৈরি হচ্ছে..."
);

}

}


function listenCandidates(base,caller){

const candidatePath =
caller
? "calleeCandidates"
: "callerCandidates";


const candidatesRef =
ref(
db,
base +
"/" +
candidatePath
);


onChildAdded(
candidatesRef,
async snapshot => {

if(!peerConnection){

return;

}


try{

await peerConnection.addIceCandidate(
new RTCIceCandidate(
snapshot.val()
)
);

}catch(error){

console.error(error);

}

});

}


function listenForOffer(peerId){

const path =
getConnectionPath(
currentUser.uid,
peerId
);


const base =
"voiceConnections/" +
path;


const offerRef =
ref(
db,
base + "/offer"
);


onValue(
offerRef,
async snapshot => {

if(!snapshot.exists()){

return;

}


if(
isCaller(
currentUser.uid,
peerId
)
){

return;

}


if(!localStream){

return;

}


if(!peerConnection){

currentPeerId =
peerId;

peerConnection =
createPeer();

listenCandidates(
base,
false
);

}


const offer =
snapshot.val();


await peerConnection.setRemoteDescription(
new RTCSessionDescription(
offer
)
);


const answer =
await peerConnection.createAnswer();


await peerConnection.setLocalDescription(
answer
);


await set(
ref(
db,
base + "/answer"
),
{
type:answer.type,
sdp:answer.sdp
}
);


showMessage(
"Voice connection তৈরি হচ্ছে..."
);

});

}


function listenForAnswer(peerId){

if(
!isCaller(
currentUser.uid,
peerId
)
){

return;

}


const path =
getConnectionPath(
currentUser.uid,
peerId
);


const answerRef =
ref(
db,
"voiceConnections/" +
path +
"/answer"
);


onValue(
answerRef,
async snapshot => {

if(!snapshot.exists()){

return;

}


if(!peerConnection){

return;

}


if(
peerConnection
.currentRemoteDescription
){

return;

}


await peerConnection.setRemoteDescription(

new RTCSessionDescription(
snapshot.val()
)

);

});

}


function watchUsers(){

const usersRef =
ref(
db,
"rooms/" +
roomId +
"/users"
);


onValue(
usersRef,
snapshot => {

const users =
snapshot.val() || {};


const ids =
Object.keys(users);


const others =
ids.filter(
id =>
id !== currentUser.uid
);


if(others.length === 0){

currentPeerId = null;

otherUser.textContent =
"👤 Waiting for another person...";

statusText.textContent =
"🟢 Room ready";

return;

}


const peerId =
others[0];


currentPeerId =
peerId;


const peer =
users[peerId];


otherUser.textContent =
"👤 " +
(
peer.name ||
"Voxa User"
);


listenForOffer(peerId);

listenForAnswer(peerId);


if(localStream){

startConnection(
peerId
);

}

});

}


async function enterRoom(){

const userRef =
ref(
db,
"rooms/" +
roomId +
"/users/" +
currentUser.uid
);


await set(
userRef,
{
name:
currentUser.displayName ||
currentUser.email,

joinedAt:
Date.now()
}
);


onDisconnect(
userRef
