      width: 100%;

      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,.2);

    }

    input {

      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #00a884;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #00a884;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .switch span {
      color: #00a884;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #e53935;
      min-height: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
