<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxa Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#00a884,#00796b);
  padding:20px;
}

.box{
  width:100%;
  max-width:390px;
  background:white;
  border-radius:24px;
  padding:30px 24px;
  box-shadow:0 10px 35px rgba(0,0,0,.2);
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:bold;
  color:#00a884;
}

.subtitle{
  text-align:center;
  color:#777;
  margin:5px 0 25px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#00a884;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:disabled{opacity:.6}

.switch{
  text-align:center;
  margin-top:20px;
  color:#00a884;
  font-weight:bold;
  cursor:pointer;
}

#message{
  text-align:center;
  margin-top:15px;
  font-size:14px;
}

.hidden{display:none}
</style>
</head>

<body>

<div class="box">

  <div class="logo">Voxa</div>
  <div class="subtitle">Voice • Friends • Community</div>

  <h2 id="title">Login</h2>

  <input id="name" class="hidden" type="text" placeholder="Your Name">

  <input id="email" type="email" placeholder="Email">

  <input id="password" type="password" placeholder="Password">

  <button id="mainBtn">Login</button>

  <div id="switchText" class="switch">
    Create a new account
  </div>

  <div id="message"></div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyA5gUOduogmjx8b4-knQMnFQRWPUn-xecQ",
  authDomain: "voxa-fc846.firebaseapp.com",
  databaseURL: "https://voxa-fc846-default-rtdb.firebaseio.com",
  projectId: "voxa-fc846",
  storageBucket: "voxa-fc846.firebasestorage.app",
  messagingSenderId: "337160477784",
  appId: "1:337160477784:web:4098a526345d4d02d3e2d2",
  measurementId: "G-F9MTE9F5V7"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* KEEP LOGIN */

await setPersistence(auth, browserLocalPersistence);


/* ELEMENTS */

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const mainBtn = document.getElementById("mainBtn");
const switchText = document.getElementById("switchText");

const title = document.getElementById("title");
const message = document.getElementById("message");

let registerMode = false;


/* LOGIN / REGISTER SWITCH */

switchText.onclick = function(){

  registerMode = !registerMode;

  message.textContent = "";

  if(registerMode){

    title.textContent = "Create Account";
    nameInput.classList.remove("hidden");
    mainBtn.textContent = "Register";
    switchText.textContent = "Already have an account? Login";

  }else{

    title.textContent = "Login";
    nameInput.classList.add("hidden");
    mainBtn.textContent = "Login";
    switchText.textContent = "Create a new account";

  }

};


/* MAIN BUTTON */

mainBtn.onclick = async function(){

  const name = nameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  message.style.color = "#e53935";
  message.textContent = "";

  if(!email){

    message.textContent = "Email দিন।";
    return;

  }

  if(!password){

    message.textContent = "Password দিন।";
    return;

  }

  if(registerMode && !name){

    message.textContent = "আপনার নাম দিন।";
    return;

  }

  if(registerMode && password.length < 6){

    message.textContent = "Password কমপক্ষে ৬ অক্ষরের হতে হবে।";
    return;

  }


  mainBtn.disabled = true;

  mainBtn.textContent =
    registerMode ? "Registering..." : "Logging in...";


  try{

    if(registerMode){

      /* CREATE ACCOUNT */

      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      await updateProfile(result.user,{
        displayName:name
      });


      await setDoc(
        doc(db,"users",result.user.uid),
        {
          name:name,
          email:email,
          coins:0,
          createdAt:new Date().toISOString()
        }
      );


      message.style.color = "#00a884";
      message.textContent = "Account তৈরি হয়েছে!";


      setTimeout(function(){

        window.location.href = "index.html";

      },800);


    }else{

      /* LOGIN */

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      message.style.color = "#00a884";
      message.textContent = "Login successful!";


      setTimeout(function(){

        window.location.href = "index.html";

      },800);

    }


  }catch(error){

    console.log(error);

    message.style.color = "#e53935";

    if(error.code === "auth/invalid-credential"){

      message.textContent =
        "Email অথবা Password ভুল।";

    }else if(error.code === "auth/email-already-in-use"){

      message.textContent =
        "এই Email দিয়ে আগে থেকেই account আছে।";

    }else if(error.code === "auth/invalid-email"){

      message.textContent =
        "সঠিক Email দিন।";

    }else if(error.code === "auth/weak-password"){

      message.textContent =
        "Password কমপক্ষে ৬ অক্ষরের হতে হবে।";

    }else{

      message.textContent =
        "সমস্যা: " + error.message;

    }

  }


  mainBtn.disabled = false;

  mainBtn.textContent =
    registerMode ? "Register" : "Login";

};

</script>

</body>
</html>
