<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxa — Login & Register</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#171126,#38216b);color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:18px}
.box{width:100%;max-width:390px;background:#241a3d;padding:25px;border-radius:22px;box-shadow:0 20px 50px #0007}
.logo{text-align:center;font-size:40px;font-weight:800}
.sub{text-align:center;color:#bbb;margin:5px 0 22px}
.tabs{display:flex;gap:5px;margin-bottom:15px}
.tabs button{flex:1;padding:12px;border:0;border-radius:9px;background:#382b51;color:#bbb}
.tabs .on{background:#7c4dff;color:#fff}
input{width:100%;padding:13px;margin:6px 0;box-sizing:border-box;border-radius:9px;border:1px solid #594873;background:#171126;color:#fff}
.go{width:100%;padding:14px;margin-top:10px;border:0;border-radius:9px;background:#7c4dff;color:white;font-weight:bold}
.msg{text-align:center;color:#ffd166;margin-top:12px;min-height:20px}
.profile{background:#171126;padding:16px;border-radius:12px;margin-top:15px}
.coins{font-size:27px;color:#ffd166;font-weight:bold}
</style>
</head>
<body>

<div class="box">
<div class="logo">VOXA</div>
<div class="sub">Voice • Friends • Community</div>

<div id="auth">
<div class="tabs">
<button id="lt" class="on">Login</button>
<button id="rt">Register</button>
</div>

<input id="name" placeholder="আপনার নাম" style="display:none">
<input id="email" type="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button id="go" class="go">Login</button>
<div id="msg" class="msg"></div>
</div>

<div id="home" style="display:none">
<h2>স্বাগতম, <span id="who"></span> 👋</h2>
<div class="profile">
Voxa Coins
<div class="coins">🪙 <span id="coins">0</span></div>
<small id="mail"></small>
</div>
<button id="out" class="go">Logout</button>
</div>

</div>

<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import{getFirestore,doc,setDoc,getDoc}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyA5gUOduogMjx8b4-knQMnFQRWPUn-xecQ",
authDomain:"voxa-fc846.firebaseapp.com",
projectId:"voxa-fc846",
storageBucket:"voxa-fc846.firebasestorage.app",
messagingSenderId:"337160477784",
appId:"1:337160477784:web:4098a526345da4d02d3e2d",
measurementId:"G-F9MTE9F5V7"
};


const app=initializeApp(firebaseConfig),
auth=getAuth(app),
db=getFirestore(app);

let reg=false;

const $=id=>document.getElementById(id);

const msg=t=>{
$("msg").textContent=t
};


function mode(x){

reg=x;

$("name").style.display=x?"block":"none";

$("go").textContent=x?"Create Account":"Login";

$("lt").className=x?"":"on";

$("rt").className=x?"on":"";

msg("");

}


$("lt").onclick=()=>mode(false);

$("rt").onclick=()=>mode(true);


$("go").onclick=async()=>{

try{

let e=$("email").value.trim(),
p=$("pass").value;

if(!e||!p)
return msg("Email ও Password দিন।");

$("go").disabled=true;


if(reg){

let n=$("name").value.trim()||"Voxa User";

let c=await createUserWithEmailAndPassword(auth,e,p);

await updateProfile(c.user,{displayName:n});

await setDoc(doc(db,"users",c.user.uid),{
name:n,
email:e,
coins:0,
createdAt:new Date().toISOString()
});

msg("Account তৈরি হয়েছে ✅");

}else{

await signInWithEmailAndPassword(auth,e,p);

msg("Login সফল ✅");

}

}catch(e){

let m={

"auth/email-already-in-use":
"এই Email দিয়ে Account আগে থেকেই আছে।",

"auth/invalid-email":
"Email ঠিক নয়।",

"auth/weak-password":
"Password কমপক্ষে 6 অক্ষরের দিন।",

"auth/invalid-credential":
"Email অথবা Password ভুল।"

};

msg(m[e.code]||("সমস্যা হয়েছে: "+e.code));

}finally{

$("go").disabled=false;

}

};


onAuthStateChanged(auth,async u=>{

if(!u){

$("auth").style.display="block";
$("home").style.display="none";

return;

}

$("auth").style.display="none";
$("home").style.display="block";

$("who").textContent=u.displayName||"Voxa User";

$("mail").textContent=u.email||"";

let s=await getDoc(doc(db,"users",u.uid));

if(s.exists())
$("coins").textContent=s.data().coins??0;

});


$("out").onclick=()=>signOut(auth);

</script>

</body>
</html>
