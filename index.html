<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Voxa</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f6fb;
 color:#171827
}

header{
 background:linear-gradient(135deg,#6857f5,#9a62ff);
 color:white;
 padding:18px 16px 28px;
 border-radius:0 0 28px 28px
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center
}

.logo{
 font-size:28px;
 font-weight:900;
 letter-spacing:2px
}

.welcome{
 margin-top:24px
}

.welcome h2{
 margin:0 0 6px
}

.welcome p{
 margin:0;
 opacity:.85
}

.card{
 background:white;
 margin:14px 16px;
 padding:18px;
 border-radius:20px;
 box-shadow:0 5px 18px #0001
}

.coins{
 display:flex;
 justify-content:space-between;
 align-items:center
}

.coin{
 font-size:26px;
 font-weight:800;
 margin-top:5px
}

button{
 border:0;
 cursor:pointer
}

.add,.join{
 background:#6857f5;
 color:white;
 border-radius:11px;
 padding:10px 15px;
 font-weight:bold
}

.title{
 font-size:19px;
 font-weight:800;
 margin:20px 16px 10px
}

.rooms{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 margin:0 16px 90px
}

.room{
 background:white;
 padding:15px;
 border-radius:18px;
 box-shadow:0 4px 15px #0000000b
}

.room .emoji{
 font-size:30px
}

.room h3{
 font-size:16px;
 margin:8px 0 4px
}

.room p{
 font-size:13px;
 color:#777;
 margin:0 0 12px
}

.join{
 width:100%;
 background:#eeeaff;
 color:#5b4ce6
}

#profile{
 display:none
}

.avatar{
 width:80px;
 height:80px;
 border-radius:50%;
 margin:auto;
 background:linear-gradient(135deg,#6857f5,#a964ff);
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:32px;
 font-weight:bold
}

.center{
 text-align:center
}

.name{
 font-size:21px;
 font-weight:bold;
 margin-top:10px
}

.email{
 color:#777;
 font-size:13px;
 margin-top:4px
}

.stats{
 display:flex;
 justify-content:space-around;
 margin-top:20px
}

.stats b{
 display:block;
 font-size:20px
}

.stats span{
 font-size:12px;
 color:#777
}

.action{
 display:block;
 width:100%;
 text-align:left;
 padding:14px;
 margin-top:10px;
 border-radius:12px;
 background:#f1f2f7;
 font-weight:bold
}

.logout{
 background:#ffe8eb;
 color:#d52240
}

nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:white;
 border-top:1px solid #ddd;
 display:flex;
 justify-content:space-around;
 padding:9px 4px 12px;
 z-index:5
}

nav button{
 background:none;
 color:#777;
 font-size:12px
}

nav button.active{
 color:#6353eb;
 font-weight:bold
}

nav span{
 display:block;
 font-size:21px;
 margin-bottom:2px
}

.toast{
 display:none;
 position:fixed;
 bottom:78px;
 left:50%;
 transform:translateX(-50%);
 background:#171827;
 color:white;
 padding:10px 16px;
 border-radius:12px;
 z-index:9;
 font-size:13px;
 white-space:nowrap
}
</style>
</head>

<body>

<section id="home">

<header>

<div class="top">
<div class="logo">VOXA</div>

<button
style="background:#ffffff25;color:white;padding:10px;border-radius:12px"
onclick="toast('Notifications আসছে 🔔')">
🔔
</button>

</div>

<div class="welcome">

<h2 id="welcome">স্বাগতম 👋</h2>

<p>
Voice • Friends • Community
</p>

</div>

</header>


<div class="card coins">

<div>

<small style="color:#777">
Voxa Coins
</small>

<div class="coin">
🪙 <span id="coins">0</span>
</div>

</div>

<button
class="add"
onclick="toast('Coins system শীঘ্রই আসছে 🪙')">
+ Add
</button>

</div>


<div class="title">
🎙️ Live Voice Rooms
</div>


<div class="rooms">


<div class="room">

<div class="emoji">
🎵
</div>

<h3>
Music Lounge
</h3>

<p>
👥 12 people
</p>

<button
class="join"
onclick="toast('Voice Room শীঘ্রই আসছে 🎙️')">
Join
</button>

</div>


<div class="room">

<div class="emoji">
💬
</div>

<h3>
Bangla Chat
</h3>

<p>
👥 8 people
</p>

<button
class="join"
onclick="toast('Voice Room শীঘ্রই আসছে 🎙️')">
Join
</button>

</div>


<div class="room">

<div class="emoji">
🎮
</div>

<h3>
Gaming Zone
</h3>

<p>
👥 21 people
</p>

<button
class="join"
onclick="toast('Voice Room শীঘ্রই আসছে 🎙️')">
Join
</button>

</div>


<div class="room">

<div class="emoji">
🌙
</div>

<h3>
Night Talk
</h3>

<p>
👥 5 people
</p>

<button
class="join"
onclick="toast('Voice Room শীঘ্রই আসছে 🎙️')">
Join
</button>

</div>


</div>

</section>


<section id="profile">

<header>

<div class="top">

<div class="logo">
PROFILE
</div>

</div>

</header>


<div class="card center">

<div
class="avatar"
id="avatar">
V
</div>

<div
class="name"
id="pname">
Voxa User
</div>

<div
class="email"
id="email">
</div>


<div class="stats">

<div>
<b id="pcoins">
0
</b>
<span>
Coins
</span>
</div>

<div>
<b>
0
</b>
<span>
Friends
</span>
</div>

<div>
<b>
0
</b>
<span>
Rooms
</span>
</div>

</div>

</div>


<div class="card">

<button
class="action"
onclick="toast('Edit Profile শীঘ্রই আসছে ✏️')">
✏️ Edit Profile
</button>

<button
class="action"
onclick="toast('Settings শীঘ্রই আসছে ⚙️')">
⚙️ Settings
</button>

<button
class="action logout"
id="logout">
🚪 Logout
</button>

</div>

</section>


<nav>

<button
id="homeBtn"
class="active"
onclick="home()">

<span>🏠</span>
Home

</button>


<button
onclick="toast('Voice Rooms শীঘ্রই আসছে 🎙️')">

<span>🎙️</span>
Rooms

</button>


<button
onclick="toast('Chat শীঘ্রই আসছে 💬')">

<span>💬</span>
Chat

</button>


<button
id="profileBtn"
onclick="profile()">

<span>👤</span>
Profile

</button>

</nav>


<div
id="toastBox"
class="toast">
</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


import {
getFirestore,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyA5gUOduogMjx8b4-knQMnFQRWPUn-xecQ",

authDomain:
"voxa-fc846.firebaseapp.com",

projectId:
"voxa-fc846",

storageBucket:
"voxa-fc846.firebasestorage.app",

messagingSenderId:
"337160477784",

appId:
"1:337160477784:web:4098a526345da4d02d3e2d",

measurementId:
"G-F9MTE9F5V7"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


window.toast=m=>{

let x=document.getElementById("toastBox");

x.textContent=m;

x.style.display="block";

setTimeout(
()=>x.style.display="none",
2200
);

};


window.home=()=>{

document.getElementById("home").style.display="block";

document.getElementById("profile").style.display="none";

document
.getElementById("homeBtn")
.classList.add("active");

document
.getElementById("profileBtn")
.classList.remove("active");

};


window.profile=()=>{

document.getElementById("home").style.display="none";

document.getElementById("profile").style.display="block";

document
.getElementById("homeBtn")
.classList.remove("active");

document
.getElementById("profileBtn")
.classList.add("active");

};


onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href="login.html";

return;

}


let name=
user.displayName ||
"Voxa User";


document.getElementById("welcome")
.textContent=
"স্বাগতম, "+name+" 👋";


document.getElementById("pname")
.textContent=name;


document.getElementById("email")
.textContent=
user.email || "";


document.getElementById("avatar")
.textContent=
name.charAt(0).toUpperCase();


try{

let s=
await getDoc(
doc(db,"users",user.uid)
);


let c=
s.exists()
?
(s.data().coins ?? 0)
:
0;


document.getElementById("coins")
.textContent=c;


document.getElementById("pcoins")
.textContent=c;


}catch(e){

console.log(e);

}

});


document.getElementById("logout")
.onclick=
async()=>{

await signOut(auth);

location.reload();

};

</script>

</body>
</html>
